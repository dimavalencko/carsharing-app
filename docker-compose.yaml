version: '3.8'

services:
  api-gateway:
    build:
      context: ./services
      dockerfile: api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - IDENTITY_HOST=identity
      - IDENTITY_PORT=3001
      - CARS_SERVICE_HOST=cars
      - CARS_SERVICE_PORT=3003
      - BOOKING_SERVICE_HOST=booking
      - BOOKING_SERVICE_PORT=3002
    depends_on:
      - identity
      - cars
      - booking
    networks:
      - carsharing-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  identity:
    build:
      context: ./services
      dockerfile: identity/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - SERVICE_PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=root
      - DB_NAME=identity
    depends_on:
      - postgres
    networks:
      - carsharing-net
    restart: unless-stopped

  booking:
    build:
      context: ./services
      dockerfile: booking/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - SERVICE_PORT=3002
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=root
      - DB_NAME=booking
      - CARS_SERVICE_HOST=cars
      - CARS_SERVICE_PORT=3003
    depends_on:
      - postgres
      - cars
    networks:
      - carsharing-net
    restart: unless-stopped

  cars:
    build:
      context: ./services
      dockerfile: cars/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - SERVICE_PORT=3003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=root
      - DB_NAME=cars
    depends_on:
      - postgres
    networks:
      - carsharing-net
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - carsharing-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  carsharing-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local