name: CI — Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docker compose config
        run: docker compose config --quiet

  build:
    name: Build · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: identity
            context: services
            dockerfile: services/identity/Dockerfile

          - service: api-gateway
            context: services
            dockerfile: services/api-gateway/Dockerfile

          - service: cars
            context: services
            dockerfile: services/cars/Dockerfile

          - service: booking
            context: services
            dockerfile: services/booking/Dockerfile

          - service: client
            context: client
            dockerfile: client/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.service }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=build-${{ matrix.service }}
          cache-to: type=gha,scope=build-${{ matrix.service }},mode=max

  all-built:
    name: All images built
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "❌ One or more images failed to build"
            exit 1
          fi
          echo "✅ All images built successfully"

  deploy:
    name: Deploy to VDS
    runs-on: ubuntu-latest
    needs: all-built
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          source: "docker-compose.prod.yaml,init.sql"
          target: "/opt/carsharing"

      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          script: |
            cd /opt/carsharing

            # Create .env if not exists
            if [ ! -f .env ]; then
              cat > .env << 'ENVEOF'
            DB_USERNAME=postgres
            DB_PASSWORD=postgres
            DB_HOST=postgres
            DB_PORT=5432
            IMAGE_TAG=latest
            ENVEOF
            fi

            echo "${{ secrets.GHCR_READ_TOKEN }}" | docker login ghcr.io -u dimavalencko --password-stdin

            # Stop old containers and clean up
            docker compose -f docker-compose.prod.yaml down --remove-orphans

            # Pull latest images
            docker compose -f docker-compose.prod.yaml pull

            # Start fresh with new network
            docker compose -f docker-compose.prod.yaml up -d

            # Wait for services to be healthy
            echo "Waiting for services to start..."
            sleep 15

            # Health check
            echo "Checking container health..."
            if docker compose -f docker-compose.prod.yaml ps | grep -E "Exited"; then
              echo "❌ Some containers failed to start"
              docker compose -f docker-compose.prod.yaml logs --tail=100
              exit 1
            fi

            # Verify all services are healthy or up
            docker compose -f docker-compose.prod.yaml ps
            echo "✅ Deploy completed successfully"
